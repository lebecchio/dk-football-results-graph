# manifest/puljer.yaml — checked-in, hand-curated seed list of DBU pulje IDs
# for the 2025/26 season (spec R2.1). This is the primary discovery
# mechanism: dbu.dk has no robots-permitted way to enumerate puljer
# mechanically (the advanced search is disallowed — spec C1/C5).
#
# HOW THESE IDS WERE FOUND — not guessed, not scraped from a disallowed
# path. Every ID below was resolved via:
#   GET /resultater/raekkesoeg/?unionid=1&genderid=<G>&divisionid=<D>&season=2026
#   -> GET /resultater/Raekke/<raekkeId>   (302 redirect to /resultater/pulje/<id>,
#                                            or a 200 page listing multiple puljer
#                                            for split competitions like Herre-DS)
# Neither path is robots-disallowed (only /resultater/kampsoegAdvanceret/ and
# /turneringer_og_resultater/resultatsoegning/ are). Full method and the raw
# redirect table are recorded in
# docs/specs/dk-results-scraper/discovery-notes.md (Finding 0).
#
# Run `dkfr manifest verify` after editing — it fetches every pulje below and
# confirms its real <h2> title matches the declared competition/phase/group/
# season code (2026 = 2025/26 per spec F11). AC1.
#
# Administrator: determined by grepping every one of the 31 cached
# stillingFuld pages (all fetched during T3/T4) for the live footer text
# "Spørgsmål omkring denne række skal rettes til Divisionsforeningen" —
# not guessed, checked on every single manifest entry, 100% consistent
# within each competition. Real pattern found: Divisionsforeningen
# administers all four fully-professional/semi-pro men's tiers (Superliga,
# 1./2./3. Division) PLUS both boys' Liga-tier youth competitions (U19 and
# U17 Drenge Ligaen); DBU administers Herre-DS (tier 5) directly and every
# women's/girls' competition (A-Liga, B-Liga, U19 Piger Liga, U16 Piger
# Liga) directly. This is a real finding, not the "Superliga + U19 Drenge
# only" pattern the spec's F1 sample suggested — CampoBet 2./3. Division
# and U17 Drenge Ligaen also route to Divisionsforeningen.

