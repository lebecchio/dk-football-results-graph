# manifest/clubs.yaml — exceptions to the default club-grouping rule
# (design Decision 3: "Default: clubId = slug(canonicalTeamName with squad
# ordinal stripped)").
#
# Populate this file when `dkfr names review` flags a "club-grouping
# suspect" — two or more distinct default clubIds that plausibly belong to
# the same real-world club. Checked empirically during T7 against the full
# 31-pulje manifest fetch (data/cache/, gitignored, not committed).
#
# ONE confirmed real case found: FC København renders with a period-heavy
# style ("F.C. København") on its senior-tier puljer (Superliga, B-Liga)
# but without periods ("FC København") on its youth puljer (U19/U17 Drenge
# Ligaen) — these slug to DIFFERENT default clubIds ("f-c-koebenhavn" vs
# "fc-koebenhavn"), which would silently defeat U7/AC18 (cross-bracket club
# traversal) for one of DBU's biggest, most-connected clubs if left
# unmerged. Overridden below so both variants resolve to one clubId.
#
# Several OTHER fuzzy-similar name pairs were found by the same scan and
# deliberately NOT merged here — see data/reports/unresolved-names.json
# (generated by `dkfr names review`, gitignored) for the full list with
# rapidfuzz scores. Examples: "AB" vs "AaB" are two distinct, well-known
# Danish clubs (Akademisk Boldklub vs Aalborg Boldklub) that must NOT be
# merged despite a high string-similarity score — exactly the failure mode
# AC10/C9 warn against ("do not expect a fully automatic solution").
# "Esbjerg" vs "Esbjerg fB", "Brøndby IF" vs "Brøndby", "Viborg FF" vs
# "Viborg", "Lyngby" vs "Lyngby BK", "Silkeborg IF" vs "Silkeborg",
# "Hvidovre" vs "Hvidovre IF", and "Næstved HG" vs "Næstved" are all
# plausible reserve-team/youth-section short-name truncations OR distinct
# clubs sharing a home city name — each needs a human to check DBU's club
# records before merging, which is exactly why this file requires manual
# curation rather than auto-applying rapidfuzz's suggestions.
#
# Format:
# overrides:
#   "<raw display name, case-insensitive, squad-ordinal already stripped>":
#     clubId: "<override-slug>"
#     displayName: "<canonical display name to store on the Club node>"

overrides:
  "f.c. københavn":
    clubId: "fc-koebenhavn"
    displayName: "FC København"
  "fc københavn":
    clubId: "fc-koebenhavn"
    displayName: "FC København"
