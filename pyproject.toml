[project]
name = "dkfr"
version = "0.1.0"
description = "Danish football (DBU) results scraper -> Neo4j graph, 2025/26 season"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "neo4j>=5.26,<6",
    "rapidfuzz>=3.9",
]

[project.scripts]
dkfr = "dkfr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dkfr"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-httpx>=0.30",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_db: requires a running Neo4j instance",
    "live_cache: requires a warm data/cache directory from a real fetch",
]
